version: "3.9"

services:

  # ==================================
  # 1. BACKEND (FastAPI + Gunicorn)
  # ==================================
  backend:
    build: 
      context: ./backend
      # Especifica la ruta de tu Dockerfile
      dockerfile: Dockerfile 
    container_name: citas_backend
    restart: always
    env_file: .env
    ports:
      # Puerto de la API para acceso directo (si lo necesitas)
      - "8000:8000" 
    
    # 🚨 NOTA: Se elimina el volumen de código './backend:/app'. 
    # El código se copia durante la fase de build para un entorno de producción.
    volumes:
      # Mantener el volumen de la BD si usas SQLite y quieres persistir los datos en el host
      # Si usas PostgreSQL, elimina esta línea.
      - ./backend/citas.db:/app/citas.db 
    
    # Asegúrate de que tu .env tenga configurada la variable DATABASE_URL si usas PostgreSQL

  # ==================================
  # 2. FRONTEND (React + Nginx)
  # ==================================
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citas_frontend
    restart: always
    # NO necesitas env_file para el frontend en producción si la URL de la API es fija.
    # Si usas variables de entorno para la URL de la API, añádelas aquí:
    # environment:
    #   - VITE_API_BASE_URL=http://backend:8000
    ports:
      # Mapea el puerto 3000 de tu PC al puerto 80 del contenedor Nginx
      - "3000:80" 
    depends_on:
      - backend